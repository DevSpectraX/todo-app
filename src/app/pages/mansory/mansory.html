<h2 class="title">Galeria</h2>
<section class="gallery">
    @for (column of columns; track $index) {
        <div class="gallery-column">
            @for (photo of column; track photo.src) {
                <app-photo-card [photo]="photo"></app-photo-card>
            }
        </div>
    }
    
</section>
