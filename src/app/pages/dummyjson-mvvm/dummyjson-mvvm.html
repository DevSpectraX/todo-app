<h2 class="title">Productos de la api DummyJSON</h2>
<section class="product-section">
  @if (dummyjsonVM.dummyjsonState.isLoading()) {
    <div class="products-loader">
      <!-- From Uiverse.io by mobinkakei -->
      <div class="circle"></div>
      <div class="circle"></div>
      <div class="circle"></div>
      <div class="shadow"></div>
      <div class="shadow"></div>
      <div class="shadow"></div>
    </div>
  } @else if (dummyjsonVM.dummyjsonState.error(); as error) {
    <p>{{error}}</p>
  } @else {
    @for (product of dummyjsonVM.dummyjsonState.products(); track product.id) {
      <app-dummyjson-card-mvvm [card]="product"></app-dummyjson-card-mvvm>
    }
  }
</section>
